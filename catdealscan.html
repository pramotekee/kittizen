<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Kittizen — ยืนยันการใช้สิทธิ์ Cat Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F4;
    --surface: #FFFCF9;
    --accent: #E8734A;
    --accent-dark: #D4623A;
    --text-primary: #2C2420;
    --text-secondary: #7A6E6A;
    --tag-bg: #F0E8E4;
    --border: #D2D2D7;
    --error: #e74c3c;
    --success: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 32px 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }
  .container { max-width: 480px; margin: 0 auto; width: 100%; }
  .card {
    background: var(--surface);
    border-radius: 28px;
    padding: 36px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }

  .result-icon { font-size: 64px; margin-bottom: 12px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub-line { font-size: 15px; color: var(--text-secondary); margin-bottom: 22px; }

  .code-box {
    background: var(--bg);
    border-radius: 18px;
    padding: 18px 20px;
    text-align: left;
    font-size: 14px;
    line-height: 1.9;
    margin-bottom: 18px;
  }
  .code-box .divider-line { border-top: 1px dashed var(--border); margin: 10px 0; }
  .code-box .deal-code-value {
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    word-break: break-all;
  }
  .code-box .note { font-size: 12.5px; color: var(--text-secondary); margin-top: 10px; }

  .loading { padding: 40px 0; }
  .spinner {
    display: inline-block;
    width: 36px;
    height: 36px;
    border: 4px solid var(--tag-bg);
    border-radius: 50%;
    border-top: 4px solid var(--accent);
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .manual-section { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--border); text-align: left; }
  .manual-section label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
  .manual-row { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--surface);
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,115,74,0.12); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="card" id="card">
    <!-- แสดงระหว่างรอผลจาก backend (ถ้ามี ?code= ติดมากับลิงก์) -->
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <div>กำลังตรวจสอบรหัส...</div>
    </div>

    <!-- ผลลัพธ์ (สำเร็จ/ไม่สำเร็จ) -->
    <div id="resultState" style="display:none;">
      <div class="result-icon" id="resultIcon">✅</div>
      <h1 id="resultTitle">สแกนสำเร็จ</h1>
      <div class="sub-line" id="resultSub">มอบโปรโมชั่นให้ลูกค้าได้เลยค่ะ</div>
      <div class="code-box" id="resultCodeBox"></div>
    </div>

    <!-- ช่องกรอกรหัสเอง (เผื่อกล้องสแกนแล้วไม่เด้งลิงก์ หรือพนักงานอยากพิมพ์เอง) -->
    <div class="manual-section" id="manualSection">
      <label>หรือพิมพ์ Deal Code เองตรงนี้ (ถ้ามี)</label>
      <div class="manual-row">
        <input type="text" id="manualCode" placeholder="เช่น 57f3k9mu" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="manualBtn">ยืนยัน</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylJXLg47otdgqZM6EwLma8AL1q5AEIsYe8uDOlNlTh9gOMOS7sHOgceX4l9h8ia3nGfg/exec';

  const loadingState = document.getElementById('loadingState');
  const resultState = document.getElementById('resultState');
  const manualSection = document.getElementById('manualSection');

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showResult(success, payload) {
    loadingState.style.display = 'none';
    resultState.style.display = 'block';

    if (success) {
      document.getElementById('resultIcon').textContent = '✅';
      document.getElementById('resultTitle').textContent = 'สแกนสำเร็จ';
      document.getElementById('resultSub').textContent = 'มอบโปรโมชั่นให้ลูกค้าได้เลยค่ะ';
      document.getElementById('resultCodeBox').innerHTML =
        (payload.shop_name ? '<b>ร้าน:</b> ' + escapeHtml(payload.shop_name) + '<br>' : '') +
        (payload.deal_name ? '<b>ดีล:</b> ' + escapeHtml(payload.deal_name) + '<br>' : '') +
        '<div class="divider-line"></div>' +
        'Deal Code = <span class="deal-code-value">' + escapeHtml(payload.deal_code) + '</span>' +
        '<div class="note">*กรุณาจด Deal Code นี้ไว้ที่ร้าน เพื่อเก็บไว้เป็นหลักฐานการใช้โค้ด</div>';
    } else {
      document.getElementById('resultIcon').textContent = '⚠️';
      document.getElementById('resultTitle').textContent = 'สแกนไม่สำเร็จ';
      document.getElementById('resultSub').textContent = 'กรุณาตรวจสอบกับลูกค้าอีกครั้ง';
      document.getElementById('resultCodeBox').innerHTML =
        (payload.shop_name ? '<b>ร้าน:</b> ' + escapeHtml(payload.shop_name) + '<br><div class="divider-line"></div>' : '') +
        escapeHtml(payload.error || 'เกิดข้อผิดพลาด ไม่ทราบสาเหตุ');
    }
  }

  async function verifyCode(code) {
    loadingState.style.display = 'block';
    resultState.style.display = 'none';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deal_scan_redeem', deal_code: code })
      });
      const result = await res.json();
      showResult(result.success, result);
    } catch (err) {
      showResult(false, { error: 'เกิดข้อผิดพลาด: ' + err.message });
    }
  }

  document.getElementById('manualBtn').addEventListener('click', function () {
    const code = document.getElementById('manualCode').value.trim();
    if (!code) return;
    verifyCode(code);
  });
  document.getElementById('manualCode').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('manualBtn').click();
  });

  // ============================================================
  // เข้าเว็บมาพร้อม ?code=xxxxxxxx (จากการสแกน QR ด้วยกล้องเครื่อง)
  // -> เช็ค + เปลี่ยนสถานะให้อัตโนมัติทันที ไม่ต้องกดอะไรเพิ่ม
  // ============================================================
  (function init() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      manualSection.style.display = 'none';
      verifyCode(code.trim());
    } else {
      loadingState.style.display = 'none';
    }
  })();
</script>

<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
