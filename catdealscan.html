<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Kittizen — สแกน QR รับสิทธิ์ (ร้านค้า)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F4;
    --surface: #FFFCF9;
    --accent: #E8734A;
    --accent-dark: #D4623A;
    --text-primary: #2C2420;
    --text-secondary: #7A6E6A;
    --tag-bg: #F0E8E4;
    --border: #D2D2D7;
    --error: #e74c3c;
    --success: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 32px 20px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border-radius: 28px;
    padding: 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 { font-size: 26px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .sub { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
  .breadcrumb { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .breadcrumb a { color: var(--accent); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .form-group label .required { color: var(--error); margin-left: 2px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--surface);
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,115,74,0.12); }

  .btn-submit {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 40px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
    transition: background 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .btn-submit:hover { background: var(--accent-dark); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--tag-bg); color: var(--text-primary); }
  .btn-secondary:hover { background: #e4dcd7; }
  .btn-danger { background: #fdecea; color: var(--error); }
  .btn-danger:hover { background: #fbdbd7; }

  .alert {
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .alert-error { background: #fdecea; color: var(--error); border-left: 4px solid var(--error); }
  .alert-success { background: #e8f8f0; color: var(--success); border-left: 4px solid var(--success); }
  .alert .alert-msg { flex: 1; }
  .alert .alert-close { background: none; border: none; color: inherit; font-size: 16px; line-height: 1; cursor: pointer; opacity: 0.6; padding: 0; flex-shrink: 0; }
  .alert .alert-close:hover { opacity: 1; }

  .shop-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--tag-bg);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .shop-badge .logout-link { color: var(--error); font-weight: 600; cursor: pointer; text-decoration: underline; margin-left: 6px; }

  #scanSection { display: none; }

  .scan-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
    display: none;
  }
  .scan-frame.active { display: block; }
  .scan-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-frame .scan-guide {
    position: absolute;
    inset: 12%;
    border: 3px solid rgba(255,255,255,0.85);
    border-radius: 20px;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  .scan-hint { text-align: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* RESULT POPUP */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .popup-overlay.open { display: flex; }
  .popup {
    background: var(--surface);
    border-radius: 28px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.25s ease;
  }
  .popup .result-icon { font-size: 52px; margin-bottom: 8px; }
  .popup h3 { font-size: 20px; margin-bottom: 8px; }
  .popup .result-body { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px; text-align: left; background: var(--bg); border-radius: 16px; padding: 16px; }
  .popup .result-body b { color: var(--text-primary); }
  .popup-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .popup-actions button {
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    width: 100%;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top: 3px solid #ffffff;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="breadcrumb"><a href="catdeal.html">🏷️ Cat Deal</a> &gt; สแกน QR รับสิทธิ์ (ร้านค้า)</div>

  <div class="card">
    <h1>📷 สแกน QR รับสิทธิ์</h1>
    <div class="sub">สำหรับพนักงานร้านค้า — สแกน QR จากตั๋วลูกค้าเพื่อยืนยันการใช้สิทธิ์</div>

    <div id="alertContainer"></div>

    <!-- LOGIN SECTION -->
    <div id="loginSection">
      <div class="form-group">
        <label>Shop ID <span class="required">*</span></label>
        <input type="text" id="loginShopId" placeholder="เช่น me06261115" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label>Shop Edit Code <span class="required">*</span></label>
        <input type="text" id="loginShopEditCode" placeholder="รหัสร้านค้าของคุณ" autocomplete="off">
      </div>
      <button class="btn-submit" id="loginBtn">🔓 เข้าสู่ระบบสแกน</button>
    </div>

    <!-- SCAN SECTION -->
    <div id="scanSection">
      <div class="shop-badge">🏪 <span id="shopBadgeName"></span><span class="logout-link" id="logoutLink">ออกจากระบบ</span></div>

      <div class="scan-frame" id="scanFrame">
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-guide"></div>
      </div>
      <canvas id="scanCanvas" style="display:none;"></canvas>

      <button class="btn-submit" id="startScanBtn">📷 เริ่มสแกนกล้อง</button>
      <button class="btn-submit btn-danger" id="stopScanBtn" style="display:none;">✋ หยุดสแกน</button>
      <div class="scan-hint" id="scanHint" style="display:none;">เล็ง QR Code จากตั๋วลูกค้าให้อยู่ในกรอบ</div>

      <div class="divider">หรือกรอกรหัสด้วยตัวเอง</div>

      <div class="form-group">
        <label>Deal Code (8 หลักจากตั๋วลูกค้า)</label>
        <input type="text" id="manualCode" placeholder="เช่น 57f3k9mu" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn-submit btn-secondary" id="manualConfirmBtn">✅ ยืนยันรหัสนี้</button>
    </div>
  </div>
</div>

<!-- RESULT POPUP -->
<div class="popup-overlay" id="resultPopup">
  <div class="popup">
    <div class="result-icon" id="resultIcon">✅</div>
    <h3 id="resultTitle"></h3>
    <div class="result-body" id="resultBody"></div>
    <div class="popup-actions">
      <button class="btn-submit" id="scanAgainBtn">📷 สแกนต่อ</button>
      <button class="btn-submit btn-secondary" id="closeResultBtn">ปิด</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylJXLg47otdgqZM6EwLma8AL1q5AEIsYe8uDOlNlTh9gOMOS7sHOgceX4l9h8ia3nGfg/exec';

  let shopId = '';
  let shopEditCode = '';
  let stream = null;
  let scanning = false;
  let rafId = null;
  let processingScan = false;

  function showAlert(msg, type) {
    const container = document.getElementById('alertContainer');
    const div = document.createElement('div');
    div.className = 'alert alert-' + type;
    div.innerHTML = `<span class="alert-msg">${msg}</span><button class="alert-close" onclick="this.parentElement.remove()">✕</button>`;
    container.innerHTML = '';
    container.appendChild(div);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  // LOGIN — ยืม action 'deal_edit_fetch' ที่มีอยู่แล้วเพื่อ verify
  // shop_id + shop_edit_code (ไม่ต้องเปิด backend action ใหม่)
  // ============================================================
  document.getElementById('loginBtn').addEventListener('click', async function () {
    const id = document.getElementById('loginShopId').value.trim();
    const code = document.getElementById('loginShopEditCode').value.trim();
    if (!id || !code) {
      showAlert('กรุณากรอก Shop ID และ Edit Code ให้ครบ', 'error');
      return;
    }

    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> กำลังตรวจสอบ...';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deal_edit_fetch', shop_id: id, shop_edit_code: code })
      });
      const result = await res.json();

      if (result.success) {
        shopId = id;
        shopEditCode = code;
        document.getElementById('alertContainer').innerHTML = '';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('scanSection').style.display = 'block';
        document.getElementById('shopBadgeName').textContent = (result.deals && result.deals[0] && result.deals[0].shop_name) || shopId;
      } else {
        showAlert(result.error || 'Shop ID หรือ Edit Code ไม่ถูกต้อง', 'error');
      }
    } catch (err) {
      showAlert('เกิดข้อผิดพลาด: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🔓 เข้าสู่ระบบสแกน';
    }
  });

  document.getElementById('logoutLink').addEventListener('click', function () {
    stopScan();
    shopId = '';
    shopEditCode = '';
    document.getElementById('loginShopId').value = '';
    document.getElementById('loginShopEditCode').value = '';
    document.getElementById('scanSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  });

  // ============================================================
  // CAMERA SCAN (jsQR)
  // ============================================================
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  document.getElementById('startScanBtn').addEventListener('click', startScan);
  document.getElementById('stopScanBtn').addEventListener('click', stopScan);

  async function startScan() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      await video.play();
      scanning = true;
      document.getElementById('scanFrame').classList.add('active');
      document.getElementById('startScanBtn').style.display = 'none';
      document.getElementById('stopScanBtn').style.display = 'block';
      document.getElementById('scanHint').style.display = 'block';
      rafId = requestAnimationFrame(tick);
    } catch (err) {
      showAlert('เปิดกล้องไม่สำเร็จ: ' + err.message + ' — ลองกรอกรหัสด้วยตัวเองด้านล่างแทน', 'error');
    }
  }

  function stopScan() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById('scanFrame').classList.remove('active');
    document.getElementById('startScanBtn').style.display = 'block';
    document.getElementById('stopScanBtn').style.display = 'none';
    document.getElementById('scanHint').style.display = 'none';
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data && !processingScan) {
        stopScan();
        handleScannedCode(code.data.trim());
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  // Manual entry fallback
  document.getElementById('manualConfirmBtn').addEventListener('click', function () {
    const code = document.getElementById('manualCode').value.trim();
    if (!code) {
      showAlert('กรุณากรอก Deal Code', 'error');
      return;
    }
    handleScannedCode(code);
  });

  // ============================================================
  // เรียก backend ตรวจ + เปลี่ยนสถานะ waiting -> used
  // ============================================================
  async function handleScannedCode(dealCode) {
    if (processingScan) return;
    processingScan = true;

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deal_scan_redeem', shop_id: shopId, shop_edit_code: shopEditCode, deal_code: dealCode })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('resultIcon').textContent = '✅';
        document.getElementById('resultTitle').textContent = 'ใช้สิทธิ์สำเร็จ!';
        document.getElementById('resultBody').innerHTML =
          `<b>ดีล:</b> ${escapeHtml(result.deal_name)}<br>` +
          `<b>รหัสเจ้าของแมว:</b> ${escapeHtml(result.cat_owner_id)}<br>` +
          `<b>เวลาที่ใช้สิทธิ์:</b> ${escapeHtml(result.used_date)}`;
      } else {
        document.getElementById('resultIcon').textContent = '⚠️';
        document.getElementById('resultTitle').textContent = 'สแกนไม่สำเร็จ';
        document.getElementById('resultBody').innerHTML = escapeHtml(result.error || 'เกิดข้อผิดพลาด ไม่ทราบสาเหตุ');
      }
      document.getElementById('manualCode').value = '';
      document.getElementById('resultPopup').classList.add('open');
    } catch (err) {
      showAlert('เกิดข้อผิดพลาด: ' + err.message, 'error');
    } finally {
      processingScan = false;
    }
  }

  document.getElementById('scanAgainBtn').addEventListener('click', function () {
    document.getElementById('resultPopup').classList.remove('open');
    startScan();
  });
  document.getElementById('closeResultBtn').addEventListener('click', function () {
    document.getElementById('resultPopup').classList.remove('open');
  });

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
