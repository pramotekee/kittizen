<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITTIZEN Cat Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400..700&family=Bungee+Shade&display=swap" rel="stylesheet">
<meta property="og:title" content="KITTIZEN Cat Contact">
<meta property="og:description" content="สแกนแล้วเจอทางกลับบ้าน — การ์ดติดต่อเจ้าของแมว">
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --accent: #E8734A;
    --accent-dark: #D4623A;
    --header: #F2B96B;
    --text-primary: #1D1D1F;
    --text-secondary: #6E6E73;
    --tag-bg: #E8E8ED;
    --border: #D2D2D7;
    --error: #e74c3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .kittizen-title {
    font-family: "Bungee Shade", sans-serif;
  }
  .contact-card-title {
    font-family: "Antonio", sans-serif;
    font-weight: 700;
  }
  .page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--header);
    padding: 40px 24px 80px;
    position: relative;
  }
  .header .brand {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--text-primary);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    line-height: 1;
  }
  .header .subtitle {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-primary);
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .card {
    background: var(--surface);
    border-radius: 24px;
    margin: -40px 20px 24px;
    padding: 28px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    flex: 1;
    position: relative;
    z-index: 2;
  }
  .owner-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    position: relative;
    z-index: 2;
  }
  .owner-photo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #E8E8ED;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    border: 3px solid var(--accent);
  }
  .owner-name {
    font-size: 26px;
    font-weight: 600;
  }
  .cats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .cat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .cat-box .thumb {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    background: #E8E8ED;
    background-size: cover;
    background-position: center;
    border: 2px solid var(--border);
  }
  .cat-box .cat-name {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .info-list { margin-bottom: 8px; }
  .info-row {
    display: flex;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label {
    font-weight: 700;
    font-size: 15px;
    width: 64px;
    flex-shrink: 0;
    color: var(--text-secondary);
  }
  .info-value {
    font-size: 15px;
    color: var(--text-primary);
    word-break: break-word;
    line-height: 1.5;
  }
  .info-value a { 
    color: var(--accent); 
    text-decoration: none; 
  }
  .info-value a:hover { 
    text-decoration: underline; 
  }
  .note-value {
    max-height: 5.5em;
    overflow: hidden;
    position: relative;
  }
  .note-value.expanded { max-height: none; }
  .see-more-btn {
    display: block;
    text-align: center;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px;
    border-radius: 40px;
    margin: 20px 20px 32px;
  }
  .see-more-btn:active { background: var(--accent-dark); }
  .state-box {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-secondary);
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--tag-bg);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 400px) {
    .header .brand { font-size: 32px; }
    .header .subtitle { font-size: 26px; }
    .owner-name { font-size: 22px; }
    .cats-grid { gap: 8px; }
    .cat-box .thumb { border-radius: 10px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="brand kittizen-title">KITTIZEN</div>
    <div class="subtitle contact-card-title">CONTACT CARD</div>
  </div>

  <div id="content">
    <div class="state-box"><span class="spinner"></span><br><br>กำลังโหลดข้อมูล...</div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylJXLg47otdgqZM6EwLma8AL1q5AEIsYe8uDOlNlTh9gOMOS7sHOgceX4l9h8ia3nGfg/exec';

  function normalizeImageUrl(url) {
    if (!url) return '';
    const gdrive1 = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
    const gdrive2 = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
    const gdrive3 = url.match(/drive\.google\.com\/uc\?.*[?&]id=([^&]+)/);
    const id = gdrive1?.[1] || gdrive2?.[1] || gdrive3?.[1];
    if (id) return `https://lh3.googleusercontent.com/d/${id}`;
    if (url.includes('dropbox.com')) {
      return url.replace('?dl=0', '?raw=1').replace('?dl=1', '?raw=1');
    }
    return url;
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function linkify(text) {
    if (!text) return '';
    const escaped = escapeHtml(text);
    return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function renderError(msg) {
    document.getElementById('content').innerHTML = `
      <div class="state-box">😿<br><br>${escapeHtml(msg)}</div>
    `;
  }

  function renderCard(data) {
    // ✅ แปลงรูปเจ้าของ
    const ownerPhoto = normalizeImageUrl(data.owner_photo);
    const ownerPhotoStyle = ownerPhoto ? `background-image:url('${ownerPhoto}')` : 'background:#E8E8ED;';

    // ✅ แปลงรูปแมว
    const catsHtml = (data.cats || []).map(cat => {
      const img = normalizeImageUrl(cat.image);
      const imgStyle = img ? `background-image:url('${img}')` : 'background:#E8E8ED;';
      return `
        <div class="cat-box">
          <div class="thumb"><img src="${img}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150/E8E8ED/999999?text=%F0%9F%90%B1';console.warn('cat image failed:', '${img}');" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div>
          <div class="cat-name">${escapeHtml(cat.name)}</div>
        </div>
      `;
    }).join('');

    // ✅ แสดง Note
    const noteHtml = data.note_to_finder
      ? `<div class="info-row">
           <div class="info-label">Note</div>
           <div class="info-value">${linkify(data.note_to_finder)}</div>
         </div>`
      : '';

    // ✅ แสดง Phone (บังคับเป็น String)
    const phone = data.phone ? data.phone.toString() : '';
    const phoneHtml = phone
      ? `<div class="info-row">
           <div class="info-label">Phone</div>
           <div class="info-value"><a href="tel:${escapeHtml(phone)}">${escapeHtml(phone)}</a></div>
         </div>`
      : '';

    // ✅ แสดง LINE
    const lineHtml = data.line_id
      ? `<div class="info-row">
           <div class="info-label">Line</div>
           <div class="info-value">${linkify(data.line_id)}</div>
         </div>`
      : '';

    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="owner-row">
          <div class="owner-photo"><img src="${ownerPhoto}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150/E8E8ED/999999?text=%F0%9F%90%B1';console.warn('owner photo failed:', '${ownerPhoto}');" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>
          <div class="owner-name">${escapeHtml(data.owner_name)}</div>
        </div>
        <div class="cats-grid">${catsHtml}</div>
        <div class="info-list">
          ${phoneHtml}
          ${lineHtml}
          ${noteHtml}
        </div>
      </div>
      <a class="see-more-btn" href="index.html?id=${encodeURIComponent(data.id)}">See more &gt;</a>
    `;
  }

  async function loadContact() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      renderError('ไม่พบรหัสโปรไฟล์ (missing id)');
      return;
    }

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'fetch_contact', id: id })
      });
      const result = await res.json();

      if (!result.success) {
        renderError(result.error || 'ไม่พบข้อมูล');
        return;
      }

      renderCard(result.data);
    } catch (err) {
      renderError('เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
  }

  loadContact();
</script>

</body>
</html>
