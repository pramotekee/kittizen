<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kittizen — Hero Banner POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bungee+Shade&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F4;
    --text-primary: #2C2420;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 1400px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 20px;
  }

  /* HERO BANNER — IMAGE VERSION (POC) */
  .header {
    position: relative;
    text-align: left;
    padding: 24px 24px 60px;
    border-radius: 0 0 32px 32px;
    margin-bottom: 20px;
    overflow: hidden;

    /* Fallback color while image loads / if it fails */
    background-color: #E8A043;

    /* Hero image is set dynamically by JS below (from Google Sheet) */
    background-size: cover;
    background-position: center 35%;
    background-repeat: no-repeat;

    /* Fixed height so image proportions stay controlled on all screens */
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
  }
  .header h1 {
    font-family: 'Bungee Shade', cursive;
    font-size: 26px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .header .slogan {
    font-size: 13px;
    font-weight: 500;
    color: #FFF5E6;
    margin-top: 8px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .header .caption {
    font-size: 11px;
    font-weight: 400;
    color: #FFE9C7;
    max-width: 320px;
    margin: 4px 0 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  /* Mobile tuning */
  @media (max-width: 640px) {
    .header {
      min-height: 240px;
      padding: 18px 16px 40px;
      background-position: center 30%;
    }
    .header h1 { font-size: 20px; letter-spacing: 1px; }
    .header .slogan { font-size: 12px; }
    .header .caption { font-size: 10px; }
  }

  /* Just a placeholder so you can see the rest of the page boundary */
  .note {
    max-width: 700px;
    margin: 30px auto;
    padding: 16px 20px;
    background: #fff;
    border-radius: 12px;
    font-size: 13px;
    color: #7A6E6A;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">

  <header class="header" id="heroHeader">
    <h1>🐱 KITTIZEN</h1>
    <p class="slogan">Show your real boss.</p>
    <p class="caption">ขอดูเจ้านายคุณหน่อยยย</p>
  </header>

  <div class="note">
    <strong>ระบบดึงรูปจาก Google Sheet ตามวันที่ (POC)</strong><br><br>
    Sheet มี 2 คอลัมน์: <code>date</code> (รูปแบบ YYYY-MM-DD) กับ <code>image_url</code><br><br>
    ถ้าหา url ของวันนี้ไม่เจอในชีท ระบบจะโชว์สีพื้นหลัง fallback (#E8A043) แทน ไม่ error
  </div>

  <div class="note" id="debugBox" style="font-family: monospace; white-space: pre-wrap; font-size: 12px;">
    กำลังโหลด...
  </div>

<script>
// ====== CONFIG: แก้ 2 ค่านี้เป็นของจริง ======
const SHEET_ID = '1FMdtivhm9rG4n9lJ20C_Lt5JsoWdfsgPDzSQnvGwhug'; // Kittizen HeroBanner sheet
const SHEET_NAME = 'herobanner';

async function loadTodayHero() {
  const header = document.getElementById('heroHeader');
  const debugBox = document.getElementById('debugBox');
  try {
    const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME);
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
    const rows = json.table.rows;

    // helper: gviz ส่งวันที่มาได้ 2 แบบ
    // 1) string ปกติ เช่น "2026-07-05"
    // 2) "Date(2026,6,5)" ถ้าคอลัมน์ A ใน Sheet เป็น Date type จริง (เดือนนับจาก 0)
    function toYMD(rawDate) {
      if (!rawDate) return null;
      const str = rawDate.toString();
      const gvizMatch = str.match(/^Date\((\d+),(\d+),(\d+)\)/);
      if (gvizMatch) {
        const y = gvizMatch[1];
        const m = String(Number(gvizMatch[2]) + 1).padStart(2, '0'); // +1 เพราะ gviz เดือนเริ่มจาก 0
        const d = String(gvizMatch[3]).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
      return str.slice(0, 10); // สมมติว่าเป็น string "YYYY-MM-DD" อยู่แล้ว
    }

    const now = new Date();
    const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'); // ใช้เวลาท้องถิ่นของเครื่อง ไม่แปลงเป็น UTC
    let imageUrl = null;
    let debugLines = ['วันนี้ (ที่ระบบใช้เทียบ): ' + today, 'จำนวนแถวที่ดึงได้: ' + rows.length, ''];

    for (const row of rows) {
      const rowDateRaw = row.c[0] && row.c[0].v;
      const rowUrl = row.c[1] && row.c[1].v;
      const parsed = toYMD(rowDateRaw);
      const isMatch = parsed === today;
      debugLines.push('raw date: ' + JSON.stringify(rowDateRaw) + '  →  parsed: ' + parsed + (isMatch ? '  ✅ MATCH' : ''));
      if (isMatch && rowUrl && !imageUrl) {
        imageUrl = rowUrl;
      }
    }

    debugLines.push('');
    debugLines.push(imageUrl ? 'ผลลัพธ์: เจอรูป → ' + imageUrl : 'ผลลัพธ์: ไม่เจอรูปของวันนี้ → ใช้สี fallback');
    debugBox.textContent = debugLines.join('\n');

    if (imageUrl) {
      header.style.backgroundImage =
        "linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.10) 100%), url('" + imageUrl + "')";
    }
  } catch (err) {
    debugBox.textContent = 'เกิด error ตอนดึงชีท:\n' + err.toString();
    console.error('โหลดรูป hero วันนี้ไม่สำเร็จ:', err);
  }
}

loadTodayHero();
</script>

</div>

</body>
</html>
